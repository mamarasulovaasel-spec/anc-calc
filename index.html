<style>
:root{
  --board:#17352E; --board-2:#0C1F1A; --board-3:#20463C;
  --paper:#F2F4EE; --surface:#FFFFFF; --surface-2:#F7F9F4;
  --ink:#13201C; --ink-2:#41544C; --ink-3:#7B8C84;
  --line:#D9E0D6; --line-2:#C3CEBE;
  --ochre:#B8860B; --ochre-soft:#F3E4BC;
  --clay:#A8442E;
  --mint:#2E7D5B;
  --chalk:#E9F1E7;
  --shadow:0 1px 2px rgba(19,32,28,.06), 0 8px 24px -12px rgba(19,32,28,.18);
  --radius:14px;
  --maxw:1080px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#0E1D19; --board-2:#08110F; --board-3:#18332C;
    --paper:#0D1412; --surface:#141E1A; --surface-2:#101917;
    --ink:#E7EFE9; --ink-2:#A9BBB2; --ink-3:#7F918A;
    --line:#243530; --line-2:#2E423B;
    --ochre:#E0B454; --ochre-soft:#3A3018;
    --clay:#E08669;
    --mint:#6FC79C;
    --chalk:#E9F1E7;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --board:#0E1D19; --board-2:#08110F; --board-3:#18332C;
  --paper:#0D1412; --surface:#141E1A; --surface-2:#101917;
  --ink:#E7EFE9; --ink-2:#A9BBB2; --ink-3:#7F918A;
  --line:#243530; --line-2:#2E423B;
  --ochre:#E0B454; --ochre-soft:#3A3018;
  --clay:#E08669;
  --mint:#6FC79C;
  --chalk:#E9F1E7;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Spectral,Georgia,"Times New Roman",serif; text-wrap:balance; margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
.eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--ink-3)}

/* ---------- hero ---------- */
.hero{background:var(--board); color:var(--chalk); position:relative; overflow:hidden}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:
    radial-gradient(120% 80% at 12% 0%, rgba(255,255,255,.07), transparent 60%),
    radial-gradient(90% 70% at 100% 100%, rgba(184,134,11,.14), transparent 60%);
}
.hero .wrap{position:relative; z-index:1; padding-top:56px; padding-bottom:56px}
.hero .eyebrow{color:rgba(233,241,231,.62)}
.hero h1{font-size:clamp(34px,6.4vw,60px); line-height:1.04; margin:16px 0 0; color:#fff}
.hero h1 em{font-style:italic; color:var(--ochre)}
.hero-sub{margin-top:18px; max-width:56ch; color:rgba(233,241,231,.84); font-size:clamp(16px,2.2vw,18px)}
.chalkline{margin-top:26px; padding:14px 16px; border:1px dashed rgba(233,241,231,.28); border-radius:12px;
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; color:rgba(233,241,231,.9); overflow-x:auto; white-space:nowrap}
.chalkline b{color:var(--ochre); font-weight:500}
.hero-cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; align-items:center}
.btn{
  display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:600; padding:13px 22px; border-radius:999px;
  background:var(--ochre); color:#1A1305; text-decoration:none; transition:transform .15s ease, filter .15s ease;
}
.btn:hover{transform:translateY(-1px); filter:brightness(1.06)}
.btn.ghost{background:transparent; color:var(--chalk); border:1px solid rgba(233,241,231,.35)}
.hero-facts{display:flex; flex-wrap:wrap; gap:26px; margin-top:34px; padding-top:22px; border-top:1px solid rgba(233,241,231,.16)}
.fact-v{font-family:"IBM Plex Mono",monospace; font-size:23px; color:#fff; font-variant-numeric:tabular-nums}
.fact-l{font-size:12.5px; color:rgba(233,241,231,.6); margin-top:2px}

/* ---------- section ---------- */
section{padding:56px 0}
.sec-head{margin-bottom:26px}
.sec-head h2{font-size:clamp(24px,3.6vw,34px); margin-top:10px}
.sec-head p{color:var(--ink-2); margin-top:10px; max-width:62ch}

/* ---------- calculator ---------- */
.calc{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.tabs{display:flex; gap:4px; padding:8px; background:var(--surface-2); border-bottom:1px solid var(--line); overflow-x:auto}
.tab{
  flex:1 1 auto; white-space:nowrap; border:0; background:transparent; cursor:pointer; border-radius:10px;
  font-family:inherit; font-size:14px; font-weight:600; color:var(--ink-2); padding:11px 14px; transition:background .15s, color .15s;
}
.tab[aria-selected="true"]{background:var(--board); color:#fff}
.tab:hover:not([aria-selected="true"]){background:var(--line)}
.panel{display:grid; grid-template-columns:1.05fr .95fr}
@media(max-width:860px){.panel{grid-template-columns:1fr}}
.form{padding:24px; display:flex; flex-direction:column; gap:16px; border-right:1px solid var(--line)}
@media(max-width:860px){.form{border-right:0; border-bottom:1px solid var(--line)}}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:14px; font-weight:600}
.field .hint{font-size:12.5px; color:var(--ink-3); line-height:1.45}
select,input[type="number"],input[type="text"]{
  font-family:inherit; font-size:15px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:10px; padding:11px 12px; width:100%;
}
input[type="number"]{font-family:"IBM Plex Mono",monospace}
select:focus-visible,input:focus-visible,.tab:focus-visible,.btn:focus-visible,summary:focus-visible{
  outline:2px solid var(--ochre); outline-offset:2px;
}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.switch{display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); cursor:pointer}
.switch input{margin:3px 0 0; accent-color:var(--mint); width:17px; height:17px}
.switch span{font-size:14px}
.switch small{display:block; color:var(--ink-3); font-size:12.5px; line-height:1.4}
.group-title{font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--ink-3); margin-top:6px}

/* ---------- result ---------- */
.result{padding:24px; background:var(--surface-2); display:flex; flex-direction:column; gap:14px}
.headline{background:var(--board); color:#fff; border-radius:12px; padding:20px}
.headline .lab{font-size:12.5px; color:rgba(233,241,231,.7); letter-spacing:.06em; text-transform:uppercase}
.headline .big{font-family:"IBM Plex Mono",monospace; font-size:clamp(30px,7vw,42px); font-weight:600; line-height:1.1; margin-top:6px; color:var(--ochre); font-variant-numeric:tabular-nums}
.headline .sub{font-size:13.5px; color:rgba(233,241,231,.75); margin-top:8px}
.mini{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mini div{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px}
.mini .lab{font-size:12px; color:var(--ink-3)}
.mini .v{font-family:"IBM Plex Mono",monospace; font-size:18px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums}
.lines{display:flex; flex-direction:column; gap:2px; margin-top:2px}
details.line{border-bottom:1px dashed var(--line); background:transparent}
details.line[open]{background:var(--surface); border-radius:8px}
details.line summary{
  list-style:none; cursor:pointer; display:flex; justify-content:space-between; gap:12px; align-items:baseline;
  padding:9px 8px; font-size:14.5px;
}
details.line summary::-webkit-details-marker{display:none}
details.line summary .t{display:flex; align-items:baseline; gap:7px}
details.line summary .t::before{content:"+"; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:13px}
details.line[open] summary .t::before{content:"–"}
details.line .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500}
details.line .why{padding:2px 8px 12px 24px; font-size:13.5px; color:var(--ink-2); line-height:1.55}
details.line .why code{font-family:"IBM Plex Mono",monospace; font-size:12.5px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:1px 6px; display:inline-block; margin-top:6px}
.line.minus .v{color:var(--clay)}
.line.total{border-bottom:0; font-weight:700}
.subtotal{display:flex; justify-content:space-between; padding:10px 8px; border-top:1px solid var(--line-2); font-weight:600; font-size:14.5px}
.subtotal .v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.notice{font-size:13px; border-radius:10px; padding:11px 13px; line-height:1.5}
.notice.warn{background:var(--ochre-soft); color:var(--ink); border:1px solid var(--ochre)}
.notice.info{background:var(--surface); border:1px solid var(--line); color:var(--ink-2)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
.actions .btn{font-size:14px; padding:11px 18px}
.actions .btn.sec{background:var(--surface); color:var(--ink); border:1px solid var(--line-2)}

/* ---------- explainer ---------- */
.steps{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
.step{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px}
.step .n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ochre); font-weight:600}
.step h3{font-size:18px; margin:8px 0 8px}
.step p{font-size:14px; color:var(--ink-2)}
.faq{display:flex; flex-direction:column; gap:10px}
.faq details{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:2px 16px}
.faq summary{cursor:pointer; list-style:none; padding:14px 0; font-weight:600; font-size:15.5px; display:flex; justify-content:space-between; gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+"; color:var(--ochre); font-family:"IBM Plex Mono",monospace}
.faq details[open] summary::after{content:"–"}
.faq .a{padding:0 0 16px; color:var(--ink-2); font-size:14.5px; line-height:1.65}
.src{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
.src div{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--mint); border-radius:10px; padding:14px 16px}
.src b{display:block; font-size:14px}
.src span{font-size:13px; color:var(--ink-2)}
footer{background:var(--board-2); color:rgba(233,241,231,.72); padding:38px 0; font-size:14px}
footer b{color:#fff}
footer .wrap{display:flex; flex-wrap:wrap; gap:20px; justify-content:space-between; align-items:center}

.sticky{
  position:sticky; bottom:0; z-index:20; display:none;
  background:var(--board); color:#fff; padding:12px 20px; box-shadow:0 -8px 24px -14px rgba(0,0,0,.5);
}
.sticky.on{display:flex; justify-content:space-between; align-items:center; gap:14px}
.sticky .l{font-size:12.5px; color:rgba(233,241,231,.72)}
.sticky .v{font-family:"IBM Plex Mono",monospace; font-size:22px; font-weight:600; color:var(--ochre); font-variant-numeric:tabular-nums}
@media(min-width:861px){.sticky{display:none !important}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

.cta-card{background:var(--board); color:var(--chalk); border-radius:12px; padding:18px}
.cta-card h3{color:#fff; font-size:18px; margin-bottom:6px}
.cta-card p{font-size:13.5px; color:rgba(233,241,231,.82); line-height:1.55}
.cta-card .btn{margin-top:14px}
.wa{background:#25D366; color:#06280F}
.wa:hover{filter:brightness(1.05)}
.offer{display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:center;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow)}
@media(max-width:760px){.offer{grid-template-columns:1fr}}
.offer h3{font-size:clamp(20px,3vw,26px)}
.offer p{color:var(--ink-2); margin-top:10px; font-size:15px}
.offer ul{margin:14px 0 0; padding-left:18px; color:var(--ink-2); font-size:14.5px; line-height:1.7}
.offer .side{display:flex; flex-direction:column; gap:10px}
.price{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:16px}
.price b{display:block; font-family:"IBM Plex Mono",monospace; font-size:20px; color:var(--ink)}
.price span{font-size:13px; color:var(--ink-3)}
footer a{color:var(--ochre); text-decoration:none; font-weight:600}

.langbar{display:flex; gap:6px; margin-bottom:22px}
.langbtn{border:1px solid rgba(233,241,231,.3); background:transparent; color:rgba(233,241,231,.78);
  font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; transition:background .15s, color .15s}
.langbtn[aria-pressed="true"]{background:var(--ochre); color:#1A1305; border-color:var(--ochre)}
.langbtn:hover[aria-pressed="false"]{background:rgba(233,241,231,.12); color:#fff}
.langnote{font-size:13px; color:var(--ink-3); margin-top:8px}
@media print{.hero,.tabs,.sticky,.actions,footer{display:none !important}}
</style>
</head>

  if (vars) for (const p in vars) v = v.split("{" + p + "}").join(vars[p]);
  return v;
};

function buildForm(){

    if (fl.t === "title"){
      const d = document.createElement("div");
      d.className = "group-title"; d.textContent = fl.label; box.appendChild(d); return;
    }
    if (fl.t === "check"){
      const l = document.createElement("label");
      l.className = "switch";
      l.innerHTML = '<input type="checkbox" data-k="' + fl.k + '"><span>' + fl.label + '<small>' + fl.sub + '</small></span>';
      if (state[fl.k]) l.querySelector("input").checked = true;
      box.appendChild(l); return;
    }
    const w = document.createElement("div");
    w.className = "field";
    const id = "f_" + fl.k;
    let ctrl;
    if (fl.t === "select"){
      ctrl = '<select id="' + id + '" data-k="' + fl.k + '">' +
        fl.opts.map(o => '<option' + (state[fl.k] === o ? " selected" : "") + '>' + o + '</option>').join("") + '</select>';
    } else {
      ctrl = '<input id="' + id + '" type="number" data-k="' + fl.k + '" value="' + (state[fl.k] ?? fl.def) +
        '" min="' + fl.min + '" max="' + fl.max + '" step="' + fl.step + '" inputmode="decimal">';
    }
    w.innerHTML = '<label for="' + id + '">' + fl.label + '</label>' + ctrl +
      (fl.hint ? '<div class="hint">' + fl.hint + '</div>' : "");
    box.appendChild(w);
  });

  const ttl = document.createElement("div");
  ttl.className = "group-title"; ttl.textContent = t("grp_high");
  box.appendChild(ttl);
  const rayons = Object.keys(REGIONS).sort((a, b) => a.localeCompare(b, "ru"));
  const w = document.createElement("div");
  w.className = "field";
  w.innerHTML = '<label for="f_rayon">' + t("f_rayon") + '</label>' +
    '<select id="f_rayon" data-k="rayon"><option>' + t("na") + '</option>' +
    rayons.map(r => '<option' + (state.rayon === r ? " selected" : "") + '>' + r + '</option>').join("") + '</select>' +
    '<div class="hint">' + t("f_rayon_h") + '</div>';
  box.appendChild(w);
  const w2 = document.createElement("div"); w2.className = "field"; w2.id = "villagewrap"; box.appendChild(w2);
  const w3 = document.createElement("div"); w3.className = "field"; w3.id = "highstagewrap"; box.appendChild(w3);
  buildVillage();
  bind();
}

function buildVillage(){
  const wrap = document.getElementById("villagewrap");
  const hs = document.getElementById("highstagewrap");
  const list = REGIONS[state.rayon];
  if (!list){ wrap.innerHTML = ""; hs.innerHTML = ""; state.village = null; return; }
  if (!list.some(v => v[0] === state.village)) state.village = list[0][0];
  wrap.innerHTML = '<label for="f_village">' + t("f_village") + '</label>' +
    '<select id="f_village" data-k="village">' +
    list.map(v => '<option' + (state.village === v[0] ? " selected" : "") + '>' + v[0] + '</option>').join("") + '</select>' +
    '<div class="hint">' + t("f_village_h") + '</div>';
  hs.innerHTML = '<label for="f_hstage">' + t("f_hstage") + '</label>' +
    '<input id="f_hstage" type="number" data-k="hstage" value="' + (state.hstage ?? 0) + '" min="0" max="60" step="1" inputmode="numeric">' +
    '<div class="hint">' + t("f_hstage_h") + '</div>';
}

function bind(){
  document.querySelectorAll("#form [data-k]").forEach(el => {
    el.addEventListener("input", () => {
      const k = el.dataset.k;
      state[k] = el.type === "checkbox" ? el.checked : (el.type === "number" ? parseFloat(el.value || 0) : el.value);
      if (k === "rayon"){ state.village = null; buildVillage(); bind(); }
      if (k === "orgp"){ state.post = POSTS[state.orgp][0][0]; buildForm(); }
      if (k === "post" || k === "mode" || k === "level"){
        fieldsOf(profile).forEach(fl => { if (state[fl.k] === undefined && fl.t !== "title") state[fl.k] = fl.t === "check" ? false : fl.def; });
        buildForm();
      }
      render();
    });
  });
}

function regionCoef(){
  const list = REGIONS[state.rayon];
  if (!list) return {c:1, why:null};
  const row = list.find(v => v[0] === state.village);
  if (!row) return {c:1, why:null};
  return {c: row[1], why: g(row[2] === "398" ? "reg398" : row[2] === "399" ? "reg399" : "regsum")};
}

/* ---------------- расчёт ---------------- */
function calc(){
  const s = state, L = [], warn = [];
  const part = h => Math.min(1, h);
  let stavka = 0, norm = 0, hours = 0, base = 0, highBase = 0, presidSet = PRES;

  if (profile === "teacher"){
    norm = s.klass === f("g14") ? 16 : 18;
    hours = +s.hours || 0;
    const k = EDU_T[s.edu];
    stavka = k * B;
    const ratio = norm ? hours / norm : 0, p = part(ratio);
    const oklad = stavka * ratio;
    L.push([g("l_oklad"), oklad, g("e_oklad", {rate:som(stavka), norm:norm, h:num(hours)}), k + " × 7 040 × " + num(hours) + " ÷ " + norm]);
    if (s.lang) L.push([g("l_lang"), oklad * .15, g("e_lang"), num(oklad) + " × 15 %"]);
    if (s.subject !== f("subj_no")) L.push([g("l_tetr"), TETR * ratio, g("e_tetr"), "2 700 × " + num(hours) + " ÷ " + norm]);
    if (s.klassruk) L.push([g("l_klass"), KLASS, g("e_klass"), g("fx")]);
    if (s.klass === f("g14")) L.push([g("l_edu14"), EDU14[s.edu] * p, g("e_edu14"), num(EDU14[s.edu]) + " × " + num(p * 100) + " %"]);
    const katIdx = [f("kat_no"), f("kat_2"), f("kat_1"), f("kat_h3")].indexOf(s.kat);
    const katSum = [0, 2000, 3000, 5000][katIdx < 0 ? 0 : katIdx];
    if (katSum) L.push([g("l_kat"), katSum, g("e_kat", {k:s.kat}), g("fx")]);
    const st = stavka * p * pedPct(+s.stage || 0);
    if (st) L.push([g("l_stage"), st, g("e_stage", {y:(+s.stage || 0), txt:pedTxt(+s.stage || 0)}),
      num(stavka) + " × " + num(p * 100) + " % × " + num(pedPct(+s.stage || 0) * 100) + " %"]);
    if (s.selo) L.push([g("l_selo"), SELO, g("e_selo"), g("fx")]);
    base = p; highBase = stavka * p;
    if (+s.subst > 0){
      const hp = stavka / (norm * 4.2);
      L.push([g("l_subst", {h:num(+s.subst)}), hp * s.subst, g("e_subst", {price:som(hp)}), num(stavka) + " ÷ (" + norm + " × 4,2) × " + num(+s.subst)]);
    }
    const maxLoad = s.klass === f("g14") ? 24 : 27;
    if (hours > maxLoad) warn.push(g("w_load", {h:num(hours), max:maxLoad}));
    if (hours === 0) warn.push(g("w_zero"));
  }

  if (profile === "kinder"){
    const map = {}; map[f("org_ds")] = [EDU_K, 36]; map[f("org_int")] = [EDU_I, 30]; map[f("org_kr")] = [EDU_KR, 20];
    const pair = map[s.org] || [EDU_K, 36];
    const tab = pair[0]; norm = pair[1]; hours = +s.hours || 0;
    const k = tab[s.edu];
    const base0 = k * B;
    stavka = s.senior ? base0 * 1.1 : base0;
    const ratio = norm ? hours / norm : 0, p = part(ratio);
    if (s.senior) L.push([g("l_senior"), base0 * .1, g("e_senior"), num(base0) + " × 10 %"]);
    L.push([g("l_oklad"), stavka * ratio, g("e_oklad", {rate:som(stavka), norm:norm, h:num(hours)}), k + " × 7 040 × " + num(hours) + " ÷ " + norm]);
    const st = stavka * p * pedPct(+s.stage || 0);
    if (st) L.push([g("l_stage"), st, g("e_stage", {y:(+s.stage || 0), txt:pedTxt(+s.stage || 0)}),
      num(stavka) + " × " + num(p * 100) + " % × " + num(pedPct(+s.stage || 0) * 100) + " %"]);
    if (s.selo) L.push([g("l_selo"), SELO, g("e_selo"), g("fx")]);
    if (+s.subst > 0){
      const hp = stavka / (norm * 4.2);
      L.push([g("l_subst", {h:num(+s.subst)}), hp * s.subst, g("e_subst", {price:som(hp)}), num(stavka) + " ÷ (" + norm + " × 4,2) × " + num(+s.subst)]);
    }
    base = p; highBase = stavka * p;
    if (hours > 54) warn.push(g("w_kinder"));
  }

  if (profile === "oklad"){
    const org = s.orgp || Object.keys(POSTS)[0];
    const list = POSTS[org] || [];
    const cur = list.find(x => x[0] === s.post) || list[0];
    const modes = [f("mode_both"), f("mode_ok"), f("mode_h2")];
    const mode = s.mode || modes[0];
    presidSet = cur[3];
    let oklad = 0;
    if (mode !== modes[2]){
      let coef, why;
      if (cur[2]){
        const c = +s.contingent || 0;
        let row = cur[2][cur[2].length - 1];
        for (const q of cur[2]){ if (c <= q[0]){ row = q; break; } }
        coef = row[1]; why = g("e_post_c", {c:coef, n:num(c)});
      } else { coef = cur[1]; why = g("e_post_f", {c:coef}); }
      oklad = coef * B;
      L.push([g("l_post"), oklad, why + g("e_post_tail"), coef + " × 7 040"]);
      const st = oklad * pedPct(+s.stage || 0);
      if (st) L.push([g("l_stage_o"), st, g("e_stage_o", {y:(+s.stage || 0), txt:pedTxt(+s.stage || 0)}),
        num(oklad) + " × " + num(pedPct(+s.stage || 0) * 100) + " %"]);
    }
    let hourPay = 0;
    const hn = s.hklass === f("g14") ? 16 : 18;
    if (mode !== modes[1]){
      const hstavka = EDU_T[s.hedu] * B;
      const hh = +s.hours || 0;
      hourPay = hstavka * hh / hn;
      if (hh > 0) L.push([g("l_hours", {h:num(hh)}), hourPay, g("e_hours", {rate:som(hstavka), norm:hn}), num(hstavka) + " × " + num(hh) + " ÷ " + hn]);
      if (s.klassruk) L.push([g("l_klass"), KLASS, g("e_klass"), g("fx")]);
      const ki = [f("kat_no"), f("kat_2"), f("kat_1"), f("kat_h3")].indexOf(s.kat);
      const ks = [0, 2000, 3000, 5000][ki < 0 ? 0 : ki];
      if (ks) L.push([g("l_kat"), ks, g("e_kat", {k:s.kat}), g("fx")]);
      if (hh > 20) warn.push(g("w_20"));
      if (mode === modes[2]) warn.push(g("w_hours_only"));
    }
    if (s.selo) L.push([g("l_selo"), SELO, g("e_selo"), g("fx")]);
    stavka = oklad || EDU_T[s.hedu] * B;
    base = mode === modes[2] ? Math.min(1, (+s.hours || 0) / hn) : 1;
    highBase = oklad + hourPay;
  }

  if (profile === "vuz"){
    const spo = s.level !== f("lvl_vpo");
    let coef, normY, why;
    if (spo){
      coef = SPO[s.edu]; normY = 720; why = g("e_coef_spo", {c:coef});
    } else {
      const dmap = {}; dmap[f("deg_no")] = "Нет"; dmap[f("deg_k")] = "Кандидат наук"; dmap[f("deg_d")] = "Доктор наук";
      const deg = dmap[s.degree] || "Нет";
      coef = VPO[s.post][deg];
      normY = deg !== "Нет" && s.post === "Старший преподаватель" ? 800 : VPO_NORM(s.post);
      why = g("e_coef_vpo", {c:coef, p:s.post, d:(deg === "Нет" ? g("d_no") : s.degree)});
      if (s.med){ coef = coef * 1.25; why += g("e_coef_med"); }
      s.__deg = deg;
    }
    stavka = coef * B; norm = normY; hours = +s.hours || 0;
    const ratio = normY ? hours / normY : 0, p = part(ratio);
    const oklad = stavka * ratio;
    L.push([g("l_oklad_y"), oklad, g("e_oklad_y", {why:why, rate:som(stavka), norm:normY, h:num(hours)}),
      num(coef) + " × 7 040 × " + num(hours) + " ÷ " + normY]);
    const pct = spo ? ORG_SPO[s.orgs] : ORG_VPO[s.orgv];
    if (pct) L.push([g("l_orgbonus"), oklad * pct, g("e_orgbonus", {p:num(pct * 100), ap:(spo ? "4" : "6")}), num(oklad) + " × " + num(pct * 100) + " %"]);
    const st = stavka * p * pedPct(+s.stage || 0);
    if (st) L.push([g("l_stage"), st, g("e_stage", {y:(+s.stage || 0), txt:pedTxt(+s.stage || 0)}),
      num(stavka) + " × " + num(p * 100) + " % × " + num(pedPct(+s.stage || 0) * 100) + " %"]);
    if (!spo){
      if (DEGREE_PAY[s.__deg]) L.push([g("l_degree"), DEGREE_PAY[s.__deg], g("e_degree"), g("fx")]);
      if (ADMIN[s.admin]) L.push([g("l_admin"), ADMIN[s.admin], g("e_admin", {a:s.admin}), g("fx")]);
    }
    if (s.selo) L.push([g("l_selo"), SELO, g("e_selo"), g("fx")]);
    base = p; highBase = stavka * p;
    if (spo && hours > 1080) warn.push(g("w_1080"));
    if (!spo && s.__deg === "Кандидат наук") warn.push(g("w_kand"));
    if (hours === 0) warn.push(g("w_zeroy"));
  }

  if (profile === "top" || profile === "mop"){
    const isTop = profile === "top";
    const tab = isTop ? TOP : MOP;
    const coef = tab[s.post] || 0;
    norm = NORM_TOP; hours = +s.hours || 0;
    stavka = coef * B;
    const ratio = hours / norm, p = part(ratio);
    const oklad = stavka * ratio;
    presidSet = PRES_TOP;
    L.push([g("l_oklad_t"), oklad, g("e_oklad_t", {c:coef, ap:(isTop ? "19" : "20"), h:num(hours)}), coef + " × 7 040 × " + num(hours) + " ÷ 40"]);
    const rz = RAZRYAD[s.razryad] || 0;
    if (rz) L.push([g("l_razryad"), oklad * rz, g("e_razryad", {r:s.razryad, p:num(rz * 100)}), num(oklad) + " × " + num(rz * 100) + " %"]);
    if (isTop){
      if (s.nenorm && /одител/.test(s.post)) L.push([g("l_nenorm"), oklad * NENORM, g("e_nenorm"), num(oklad) + " × 25 %"]);
      if (s.povar && /овар/.test(s.post)) L.push([g("l_povar"), oklad * NENORM, g("e_povar"), num(oklad) + " × 25 %"]);
      if (s.post === "Медицинская сестра" && pedPct(+s.medstage || 0) > 0)
        L.push([g("l_medstage"), stavka * p * pedPct(+s.medstage || 0), g("e_medstage", {y:(+s.medstage || 0), txt:pedTxt(+s.medstage || 0)}),
          num(stavka) + " × " + num(p * 100) + " % × " + num(pedPct(+s.medstage || 0) * 100) + " %"]);
      if (s.nenorm && !/одител/.test(s.post)) warn.push(g("w_driver", {p:s.post}));
      if (s.povar && !/овар/.test(s.post)) warn.push(g("w_cook"));
    } else {
      const may = /борщик|прачка|стирке|Гладильщик|Кухонный/.test(s.post);
      if (s.moyu && may) L.push([g("l_moyu"), oklad * MOYUSCHIE, g("e_moyu"), num(oklad) + " × 25 %"]);
      if (s.moyu && !may) warn.push(g("w_moyu"));
    }
    if (s.sovm && s.sovm !== f("sovm_no")){
      const sc = TOP[s.sovm] !== undefined ? TOP[s.sovm] : MOP[s.sovm];
      const pct = (+s.sovmpct || 0) / 100;
      if (sc !== undefined){
        L.push([g("l_sovm"), sc * B * pct, g("e_sovm", {p:s.sovm, pct:num(pct * 100), sum:som(sc * B)}), num(sc * B) + " × " + num(pct * 100) + " %"]);
        if (pct < .3) warn.push(g("w_sovm"));
      }
    }
    base = p; highBase = stavka * p;
    if (hours > 40) warn.push(g("w_40"));
  }

  const hstage = +s.hstage || 0;
  const reg = regionCoef();
  if (reg.why && highPct(hstage) > 0){
    L.push([g("l_high"), highBase * highPct(hstage), g("e_high", {y:hstage, p:num(highPct(hstage) * 100)}),
      num(highBase) + " × " + num(highPct(hstage) * 100) + " %"]);
  }

  const itogo = L.reduce((a, r) => a + r[1], 0);
  const withReg = itogo * reg.c;
  const presidSum = presidSet * base;
  const gross = withReg + presidSum;
  const insBase = gross - presidSum;
  const pf = insBase * PF, npf = insBase * NPF;
  const children = +s.children || 0;
  // НК КР ст. 191 ч. 4 п. 1: надбавка за высокогорье и районный коэффициент не облагаются
  const highLine = L.filter(x => x[0] === g("l_high")).reduce((a, x) => a + x[1], 0);
  const nonTaxable = highLine + (withReg - itogo);
  // НК КР ст. 194 п. 3: вычет взносов — только по облагаемым доходам
  const insDeduction = Math.max(0, insBase - nonTaxable) * (PF + NPF);
  const taxBase = gross - nonTaxable - insDeduction - DED - children * DED_CHILD;
  const tax = Math.max(0, taxBase) * TAX;
  const net = gross - pf - npf - tax;

  if (profile === "teacher") state.__stavka = EDU_T[s.edu] * B;
  else if (profile === "kinder") state.__stavka = stavka;
  else if (profile === "vuz") state.__stavka = stavka;
  else if (profile === "top" || profile === "mop") state.__stavka = stavka;
  else state.__stavka = stavka;

  return {L, itogo, reg, withReg, presidSum, gross, pf, npf, tax, net, warn, children, taxBase,
          base, nonTaxable, insDeduction};
}

}

/* ---------------- профили и язык ---------------- */
function setProfile(p, keepState){
  profile = p;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", String(x.dataset.prof === p)));
  if (!keepState){
    for (const k of Object.keys(state)) if (k !== "rayon" && k !== "village" && k !== "hstage") delete state[k];
    fieldsOf(p).forEach(fl => {
      if (fl.t === "num" || fl.t === "select") state[fl.k] = fl.def;
      if (fl.t === "check") state[fl.k] = false;
    });
  }
  buildForm(); render();
}

function applyLang(){
  document.documentElement.lang = LANG === "kg" ? "ky" : LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll(".langbtn").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));
  document.getElementById("sticky-l").textContent = t("sticky_net");
  document.getElementById("sticky-b").textContent = t("sticky_btn");
  setProfile(profile);
}

document.querySelectorAll(".tab").forEach(x => x.addEventListener("click", () => setProfile(x.dataset.prof)));
document.querySelectorAll(".langbtn").forEach(b => b.addEventListener("click", () => {
  LANG = b.dataset.lang;
  try { localStorage.setItem("mugalim_lang", LANG); } catch (e) {}
  applyLang();
}));
state.rayon = t("na");
applyLang();

</script>
</body>
</html>
